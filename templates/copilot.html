<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenomicOracle Co-Pilot — Case Triage</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e2e8f0;min-height:100vh}
        .top-bar{background:rgba(15,15,25,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .top-bar h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .top-bar .subtitle{font-size:.75rem;color:#64748b;margin-top:2px}
        .connect-panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:1.5rem 2rem;margin:1.5rem 2rem;display:flex;gap:1rem;align-items:end;flex-wrap:wrap}
        .connect-panel .field{flex:1;min-width:180px}
        .connect-panel label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:.4rem;font-weight:500}
        .connect-panel input,.connect-panel select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.6rem .8rem;color:#e2e8f0;font-size:.85rem;font-family:inherit}
        .connect-panel input:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.15)}
        .btn-connect{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:none;padding:.65rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;white-space:nowrap;transition:all .2s}
        .btn-connect:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(139,92,246,.4)}
        .btn-connect:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
        .status-dot.connected{background:#22c55e;box-shadow:0 0 8px #22c55e}
        .status-dot.disconnected{background:#ef4444}
        .status-dot.loading{background:#eab308;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .cases-grid{padding:1rem 2rem 3rem;display:flex;flex-direction:column;gap:1rem}
        .case-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;transition:all .3s}
        .case-card:hover{border-color:rgba(139,92,246,.3);box-shadow:0 8px 30px rgba(0,0,0,.3)}
        .case-header{display:flex;align-items:center;padding:1.25rem 1.5rem;gap:1rem;cursor:pointer}
        .case-rank{font-size:1.5rem;font-weight:700;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .case-info{flex:1;min-width:0}
        .case-info h3{font-size:1rem;font-weight:600;margin-bottom:.25rem}
        .case-info .meta{font-size:.75rem;color:#64748b;display:flex;gap:1rem;flex-wrap:wrap}
        .urgency-badge{padding:.3rem .8rem;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
        .urgency-critical{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
        .urgency-high{background:rgba(249,115,22,.15);color:#fdba74;border:1px solid rgba(249,115,22,.3)}
        .urgency-moderate{background:rgba(234,179,8,.15);color:#fde047;border:1px solid rgba(234,179,8,.3)}
        .urgency-low{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
        .score-bar{width:120px;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;flex-shrink:0}
        .score-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
        .case-body{display:none;border-top:1px solid rgba(255,255,255,.06);padding:1.5rem}
        .case-card.expanded .case-body{display:block}
        .summary-card{background:rgba(139,92,246,.05);border:1px solid rgba(139,92,246,.15);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
        .summary-card h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#8b5cf6;margin-bottom:.75rem}
        .summary-card ul{list-style:none;padding:0}
        .summary-card li{padding:.4rem 0;font-size:.85rem;color:#cbd5e1;border-bottom:1px solid rgba(255,255,255,.04)}
        .summary-card li:last-child{border:none}
        .summary-card li::before{content:"→ ";color:#8b5cf6;font-weight:600}
        .variant-table{width:100%;border-collapse:collapse;font-size:.8rem}
        .variant-table th{text-align:left;padding:.6rem .5rem;color:#64748b;font-weight:500;text-transform:uppercase;font-size:.65rem;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.08)}
        .variant-table td{padding:.55rem .5rem;border-bottom:1px solid rgba(255,255,255,.04);color:#cbd5e1}
        .variant-table tr:hover td{background:rgba(255,255,255,.02)}
        .tier-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
        .therapy-tag{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.7rem;background:rgba(6,182,212,.1);color:#67e8f9;border:1px solid rgba(6,182,212,.2);margin:1px}
        .flag-tag{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.7rem;background:rgba(234,179,8,.08);color:#fde047;margin:1px}
        .empty-state{text-align:center;padding:4rem 2rem;color:#475569}
        .empty-state .icon{font-size:3rem;margin-bottom:1rem}
        .empty-state p{font-size:.9rem;max-width:400px;margin:0 auto;line-height:1.6}
        .loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#8b5cf6;border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .stats-row{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
        .stat-chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:.5rem .8rem;font-size:.75rem;color:#94a3b8}
        .stat-chip strong{color:#e2e8f0;font-size:.9rem;margin-right:.3rem}
        .section-title{font-size:.85rem;font-weight:600;color:#e2e8f0;margin:1.25rem 0 .75rem;padding-bottom:.5rem;border-bottom:1px solid rgba(255,255,255,.06)}
        .back-link{color:#8b5cf6;text-decoration:none;font-size:.85rem;display:flex;align-items:center;gap:.4rem}
        .back-link:hover{color:#a78bfa}
        .add-sample-btn{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);border-radius:12px;padding:1rem;text-align:center;color:#64748b;cursor:pointer;transition:all .2s;font-size:.85rem}
        .add-sample-btn:hover{border-color:#8b5cf6;color:#8b5cf6;background:rgba(139,92,246,.05)}
        .sample-entry{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}
        .sample-entry input{flex:1}
        .remove-btn{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1.1rem;padding:.3rem .5rem}
    </style>
</head>
<body>
    <div class="top-bar">
        <div>
            <h1>🧬 GenomicOracle Co-Pilot</h1>
            <div class="subtitle">AI-Powered Case Triage Dashboard — SOPHiA DDM™ Integration</div>
        </div>
        <div style="display:flex;align-items:center;gap:1rem">
            <span id="conn-status" style="font-size:.8rem;color:#64748b"><span class="status-dot disconnected"></span>Disconnected</span>
            <a href="/" class="back-link">← Back to GenomicOracle</a>
        </div>
    </div>

    <div class="connect-panel">
        <div class="field">
            <label>Username</label>
            <input type="text" id="username" value="hackathon6@hackathon.com">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="password" value="Gono399764">
        </div>
        <div class="field" style="flex:2">
            <label>Dataset Keys (one per line, from browser Network tab)</label>
            <textarea id="dataset-keys" rows="2" style="width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.6rem .8rem;color:#e2e8f0;font-size:.78rem;font-family:'Courier New',monospace;resize:vertical"></textarea>
        </div>
        <div class="field" style="min-width:100px;flex:0">
            <label>LLM</label>
            <select id="llm-provider" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.6rem .5rem;color:#e2e8f0;font-size:.82rem">
                <option value="gemini">Gemini</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Claude</option>
                <option value="none">None</option>
            </select>
        </div>
        <button class="btn-connect" id="btn-analyze" onclick="runAnalysis()">
            🔍 Analyze & Rank
        </button>
        <button class="btn-connect" style="background:linear-gradient(135deg,#06b6d4,#0891b2)" onclick="loadDemoData()">
            📋 Demo Data
        </button>
    </div>

    <div class="cases-grid" id="cases-grid">
        <div class="empty-state">
            <div class="icon">🧬</div>
            <p>Paste dataset keys from the SOPHiA DDM™ browser Network tab and click <strong>Analyze & Rank</strong>, or click <strong>Demo Data</strong> to see the triage dashboard in action.</p>
        </div>
    </div>

<script>
const API = '';

async function runAnalysis() {
    const btn = document.getElementById('btn-analyze');
    const status = document.getElementById('conn-status');
    const keys = document.getElementById('dataset-keys').value.trim().split('\n').filter(k => k.trim());
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const llm = document.getElementById('llm-provider').value;

    if (!keys.length) { alert('Please paste at least one dataset key.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span> Connecting...';
    status.innerHTML = '<span class="status-dot loading"></span>Connecting...';

    try {
        const resp = await fetch('/api/copilot/analyze', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, dataset_keys: keys, llm_provider: llm})
        });
        const data = await resp.json();

        if (data.success) {
            status.innerHTML = '<span class="status-dot connected"></span>Connected';
            renderCases(data.ranked_cases);
        } else {
            status.innerHTML = '<span class="status-dot disconnected"></span>Error';
            alert('Error: ' + (data.error || 'Unknown error'));
        }
    } catch(e) {
        status.innerHTML = '<span class="status-dot disconnected"></span>Failed';
        alert('Connection failed: ' + e.message);
    }
    btn.disabled = false;
    btn.innerHTML = '🔍 Analyze & Rank';
}

                {gene:"EGFR",hgvs:"p.T790M",consequence:"Missense",acmg:"Pathogenic",abcd:"A",priority_score:90,clinvar:"Pathogenic",gnomad:"<0.0001",therapies:["Osimertinib"],flags:["Resistance mutation","ABCD: A"]},

}

function renderCases(cases) {
    const grid = document.getElementById('cases-grid');
    if (!cases || !cases.length) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No variants found for the provided dataset keys.</p></div>';
        return;
    }
    let html = '';
    cases.forEach((c, idx) => {
        const urgClass = 'urgency-' + c.urgency;
        const barColor = c.urgency_color;
        const summary = c.summary || {};
        const bullets = summary.summary_bullets || [];

        html += `<div class="case-card" id="case-${idx}">
            <div class="case-header" onclick="toggleCase(${idx})">
                <div class="case-rank" style="background:${barColor}20;color:${barColor};border:1px solid ${barColor}40">#${idx+1}</div>
                <div class="case-info">
                    <h3>${c.case_id}</h3>
                    <div class="meta">
                        <span>${c.total_variants} variants</span>
                        <span>${c.actionable_count} actionable</span>
                        <span>${c.pathogenic_count} pathogenic</span>
                        <span>~${summary.estimated_review_time || '?'}</span>
                    </div>
                </div>
                <span class="urgency-badge ${urgClass}">${c.urgency.toUpperCase()} — Score ${c.case_score}</span>
                <div class="score-bar"><div class="score-bar-fill" style="width:${c.case_score}%;background:${barColor}"></div></div>
            </div>
            <div class="case-body">
                ${bullets.length ? `<div class="summary-card"><h4>⚡ AI Case Summary</h4><ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
                ${summary.recommended_action ? `<div style="margin-top:.75rem;padding:.5rem .8rem;background:rgba(139,92,246,.1);border-radius:6px;font-size:.8rem;color:#c4b5fd"><strong>Action:</strong> ${summary.recommended_action}</div>` : ''}</div>` : ''}
                <div class="stats-row">
                    ${c.top_therapies && c.top_therapies.length ? c.top_therapies.map(t=>`<span class="therapy-tag">💊 ${t}</span>`).join('') : '<span class="stat-chip">No targeted therapies identified</span>'}
                </div>
                <div class="section-title">Variant Priority Ranking</div>
                <div style="overflow-x:auto">
                <table class="variant-table">
                    <thead><tr><th>Priority</th><th>Gene</th><th>HGVS</th><th>Consequence</th><th>ACMG</th><th>ABCD</th><th>ClinVar</th><th>gnomAD</th><th>Score</th><th>Flags</th></tr></thead>
                    <tbody>${(c.scored_variants||[]).map((v,vi)=>{
                        let dotColor = v.priority_score>=70?'#ef4444':v.priority_score>=50?'#f97316':v.priority_score>=30?'#eab308':'#22c55e';
                        return `<tr>
                            <td><span class="tier-dot" style="background:${dotColor}"></span>${vi+1}</td>
                            <td><strong>${v.gene}</strong></td>
                            <td style="font-family:monospace;font-size:.75rem">${v.hgvs||''}</td>
                            <td>${v.consequence||''}</td>
                            <td>${v.acmg||''}</td>
                            <td><strong>${v.abcd||''}</strong></td>
                            <td style="font-size:.72rem">${v.clinvar||''}</td>
                            <td style="font-size:.72rem">${v.gnomad||'—'}</td>
                            <td><strong>${v.priority_score}</strong></td>
                            <td>${(v.flags||[]).map(f=>`<span class="flag-tag">${f}</span>`).join(' ')}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table>
                </div>
            </div>
        </div>`;
    });
    grid.innerHTML = html;
    // Auto-expand first case
    setTimeout(() => toggleCase(0), 100);
}

function toggleCase(idx) {
    const card = document.getElementById('case-'+idx);
    if (card) card.classList.toggle('expanded');
}
</script>
</body>
</html>
